        inlined_as_list: true
      pf_safeguarding_requirements:
        name: pf_safeguarding_requirements
        description: What the organization must do to safeguard PII.
        range: PfSafeguardingRequirement
        multivalued: true
        inlined_as_list: true
      pf_policies:
        name: pf_policies
        description: The organization's privacy policies.
        range: PfPolicy
        multivalued: true
        inlined_as_list: true
      pf_controls:
        name: pf_controls
        description: The organization's controls.
        range: PfControl
        multivalued: true
        inlined_as_list: true
      pf_principle_implementations:
        name: pf_principle_implementations
        description: How the organization stands against each privacy principle.
        range: PfPrincipleImplementation
        multivalued: true
        inlined_as_list: true
      pf_risks:
        name: pf_risks
        description: The risks to people that the organization has identified.
        range: PfRisk
        multivalued: true
        inlined_as_list: true
      pf_impact_assessments:
        name: pf_impact_assessments
        description: The organization's privacy impact assessments.
        range: PfImpactAssessment
        multivalued: true
        inlined_as_list: true
      pf_breaches:
