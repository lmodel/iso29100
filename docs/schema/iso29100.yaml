  PfConsent:
    name: PfConsent
    definition_uri: https://w3id.org/lmodel/iso29100/PfConsent
    description: One person's agreement to the processing of their PII for stated
      purposes, and where it stands.
    comments:
    - The framework defines consent and its principle, and DPV maps that term to dpv:InformedConsent.
      The fields are what an adopter keeps, and go beyond the framework itself.
    from_schema: https://w3id.org/lmodel/iso29100
    exact_mappings:
    - dpv:InformedConsent
    mixins:
    - PfRecordMixin
    slots:
    - pf_purposes
    - pf_concerned_pii
    - pf_evidence
    - PfConsent_pf_principal
    - pfConsent__pf_consent_mechanism
    - pfConsent__pf_consent_given
    - pfConsent__pf_consent_state
    - pfConsent__pf_consent_withdrawn
    - pf_id
    - PfRecordMixin_title
    - description
    slot_usage:
      pf_principal:
        name: pf_principal
        required: true
    attributes:
      pf_consent_mechanism:
        name: pf_consent_mechanism
        description: How the agreement was obtained.
        range: PfConsentMechanism
      pf_consent_given:
        name: pf_consent_given
        description: When the person agreed.
        range: datetime
      pf_consent_state:
        name: pf_consent_state
        description: Where the agreement stands.
        range: PfConsentState
        required: true
      pf_consent_withdrawn:
        name: pf_consent_withdrawn
        description: When the person took the agreement back.
        range: datetime
    class_uri: iso29100:PfConsent
    rules:
