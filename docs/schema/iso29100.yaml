name: iso29100
annotations:
  standard:
    tag: standard
    value: ISO/IEC 29100:2024
  edition:
    tag: edition
    value: '2'
  publication_date:
    tag: publication_date
    value: '2024-02-16'
  replaces:
    tag: replaces
    value: ISO/IEC 29100:2011, ISO/IEC 29100:2011/Amd 1:2018
  iso_open_data_date:
    tag: iso_open_data_date
    value: '2026-11-05'
description: A LinkML model of the records an organization keeps when it applies the
  privacy framework of ISO/IEC 29100:2024 to the information and communication technology
  (ICT) systems that handle personally identifiable information (PII). The records
  say who takes part, which PII is involved and how it moves, what must be safeguarded
  and how, and how the organization stands against each privacy principle.
title: ISO/IEC 29100:2024 privacy framework records
comments:
- The version is the edition the schema models, and source is ISO's page for it. ISO
  Open Data's records of the edition and of the two it replaced are copied to src/iso29100/schema/iso-open-data/
  on the date the annotations give, and scripts/check_upstream_release.py reports
  when ISO changes them. The release tags are the schema's own versions.
- ISO/IEC 29100 is copyright ISO and IEC, and none of its text is reproduced here.
  An element's title and description are this project's own words. An element cites
  what it models by number in the iso29100_clause annotation only where a third party's
  public outline of the edition gives that number, so terms and lower subclauses go
  uncited. A reader with a licensed copy looks the text up there.
- Every record that other records refer to has a pf_id, and a reference holds that
  identifier. PfFramework holds each kind of record in a list of its own.
- The mappings to the Data Privacy Vocabulary (DPV) are the five rows DPV publishes
  for this edition, in upstream/dpv-iso.ttl, with DPV's direction kept. No other mapping
  is declared, because no source states one.
source: https://www.iso.org/standard/85938.html
see_also:
- https://lmodel.github.io/iso29100
- https://www.iso.org/standard/85938.html
id: https://w3id.org/lmodel/iso29100
version: '2024'
imports:
- linkml:types
license: Apache-2.0
prefixes:
  linkml:
    prefix_prefix: linkml
    prefix_reference: https://w3id.org/linkml/
  iso29100:
    prefix_prefix: iso29100
    prefix_reference: https://w3id.org/lmodel/iso29100/
  dpv:
    prefix_prefix: dpv
    prefix_reference: https://w3id.org/dpv#
  schema:
    prefix_prefix: schema
    prefix_reference: http://schema.org/
  xsd:
    prefix_prefix: xsd
    prefix_reference: http://www.w3.org/2001/XMLSchema#
default_prefix: iso29100
default_range: string
types:
  pf_duration:
    name: pf_duration
    definition_uri: https://w3id.org/lmodel/iso29100/PfDuration
    description: A length of time as ISO 8601 writes it, such as P7Y for seven years
      or P30D for thirty days.
    from_schema: https://w3id.org/lmodel/iso29100
    typeof: string
    base: str
    uri: xsd:duration
    pattern: ^P(?=[0-9T])([0-9]+Y)?([0-9]+M)?([0-9]+W)?([0-9]+D)?(T(?=[0-9])([0-9]+H)?([0-9]+M)?([0-9]+S)?)?$
  string:
    name: string
    definition_uri: https://w3id.org/linkml/String
    description: A character string
    notes:
    - In RDF serializations, a slot with range of string is treated as a literal or
      type xsd:string. If you are authoring schemas in LinkML YAML, the type is referenced
      with the lower case "string".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Text
    base: str
    uri: xsd:string
  integer:
    name: integer
    definition_uri: https://w3id.org/linkml/Integer
    description: An integer
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "integer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Integer
    base: int
    uri: xsd:integer
  boolean:
    name: boolean
    definition_uri: https://w3id.org/linkml/Boolean
    description: A binary (true or false) value
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "boolean".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Boolean
    base: Bool
    uri: xsd:boolean
    repr: bool
  float:
    name: float
    definition_uri: https://w3id.org/linkml/Float
    description: A real number that conforms to the xsd:float specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "float".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Float
    base: float
    uri: xsd:float
  double:
    name: double
    definition_uri: https://w3id.org/linkml/Double
    description: A real number that conforms to the xsd:double specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "double".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    close_mappings:
    - schema:Float
    base: float
    uri: xsd:double
  decimal:
    name: decimal
    definition_uri: https://w3id.org/linkml/Decimal
    description: A real number with arbitrary precision that conforms to the xsd:decimal
      specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "decimal".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    broad_mappings:
    - schema:Number
    base: Decimal
    uri: xsd:decimal
  time:
    name: time
    definition_uri: https://w3id.org/linkml/Time
    description: A time object represents a (local) time of day, independent of any
      particular day
    notes:
    - URI is dateTime because OWL reasoners do not work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "time".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Time
    base: XSDTime
    uri: xsd:time
    repr: str
  date:
    name: date
    definition_uri: https://w3id.org/linkml/Date
    description: a date (year, month and day) in an idealized calendar
    notes:
    - URI is dateTime because OWL reasoners don't work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Date
    base: XSDDate
    uri: xsd:date
    repr: str
  datetime:
    name: datetime
    definition_uri: https://w3id.org/linkml/Datetime
    description: The combination of a date and time
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "datetime".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:DateTime
    base: XSDDateTime
    uri: xsd:dateTime
    repr: str
  date_or_datetime:
    name: date_or_datetime
    definition_uri: https://w3id.org/linkml/DateOrDatetime
    description: Either a date or a datetime
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date_or_datetime".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: linkml:DateOrDatetime
    repr: str
  uriorcurie:
    name: uriorcurie
    definition_uri: https://w3id.org/linkml/Uriorcurie
    description: a URI or a CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uriorcurie".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: URIorCURIE
    uri: xsd:anyURI
    repr: str
  curie:
    name: curie
    definition_uri: https://w3id.org/linkml/Curie
    conforms_to: https://www.w3.org/TR/curie/
    description: a compact URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "curie".
    comments:
    - in RDF serializations this MUST be expanded to a URI
    - in non-RDF serializations MAY be serialized as the compact representation
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: Curie
    uri: xsd:string
    repr: str
  uri:
    name: uri
    definition_uri: https://w3id.org/linkml/Uri
    conforms_to: https://www.ietf.org/rfc/rfc3987.txt
    description: a complete URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uri".
    comments:
    - in RDF serializations a slot with range of uri is treated as a literal or type
      xsd:anyURI unless it is an identifier or a reference to an identifier, in which
      case it is translated directly to a node
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    close_mappings:
    - schema:URL
    base: URI
    uri: xsd:anyURI
    repr: str
  ncname:
    name: ncname
    definition_uri: https://w3id.org/linkml/Ncname
    description: Prefix part of CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "ncname".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NCName
    uri: xsd:string
    repr: str
  objectidentifier:
    name: objectidentifier
    definition_uri: https://w3id.org/linkml/Objectidentifier
    description: A URI or CURIE that represents an object in the model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "objectidentifier".
    comments:
    - Used for inheritance and type checking
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: ElementIdentifier
    uri: shex:iri
    repr: str
  nodeidentifier:
    name: nodeidentifier
    definition_uri: https://w3id.org/linkml/Nodeidentifier
    description: A URI, CURIE or BNODE that represents a node in a model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "nodeidentifier".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NodeIdentifier
    uri: shex:nonLiteral
    repr: str
  jsonpointer:
    name: jsonpointer
    definition_uri: https://w3id.org/linkml/Jsonpointer
    conforms_to: https://datatracker.ietf.org/doc/html/rfc6901
    description: A string encoding a JSON Pointer. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to a valid object within the current
      instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpointer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  jsonpath:
    name: jsonpath
    definition_uri: https://w3id.org/linkml/Jsonpath
    conforms_to: https://www.ietf.org/archive/id/draft-goessner-dispatch-jsonpath-00.html
    description: A string encoding a JSON Path. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to zero or more valid objects within
      the current instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  sparqlpath:
    name: sparqlpath
    definition_uri: https://w3id.org/linkml/Sparqlpath
    conforms_to: https://www.w3.org/TR/sparql11-query/#propertypaths
    description: A string encoding a SPARQL Property Path. The value of the string
      MUST conform to SPARQL syntax and SHOULD dereference to zero or more valid objects
      within the current instance document when encoded as RDF.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "sparqlpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
enums:
  PfPrinciple:
    name: PfPrinciple
    definition_uri: https://w3id.org/lmodel/iso29100/PfPrinciple
    annotations:
      iso29100_clause:
        tag: iso29100_clause
        value: '6.1'
    description: The privacy principles by their subclause numbers. A value's title
      and description are this project's own summary, and the principles' headings
      and wording are ISO's.
    from_schema: https://w3id.org/lmodel/iso29100
    permissible_values:
      principle_6_2:
        text: principle_6_2
        description: People get a say in whether their PII is processed, can agree
          or refuse purpose by purpose, and can change their minds later.
        annotations:
          iso29100_clause:
            tag: iso29100_clause
            value: '6.2'
        title: 6.2 People decide
      principle_6_3:
        text: principle_6_3
        description: The law allows each reason for processing, and people are told
          the reason before their PII is gathered, or at that moment.
        annotations:
          iso29100_clause:
            tag: iso29100_clause
            value: '6.3'
        title: 6.3 Lawful, stated reasons
      principle_6_4:
        text: principle_6_4
        description: The organization gathers only the PII that the law allows and
          its stated reasons need.
        annotations:
          iso29100_clause:
            tag: iso29100_clause
            value: '6.4'
        title: 6.4 Gather within bounds
      principle_6_5:
        text: principle_6_5
        description: Systems and procedures are built to touch as little PII as they
          can, and as few people as possible can reach it.
        annotations:
          iso29100_clause:
            tag: iso29100_clause
            value: '6.5'
        title: 6.5 A small footprint
      principle_6_6:
        text: principle_6_6
        description: PII is used, shared and kept only as far as the stated reasons
          go, and is safely disposed of afterwards.
        annotations:
          iso29100_clause:
            tag: iso29100_clause
            value: '6.6'
        title: 6.6 Bounded use and keeping
      principle_6_7:
        text: principle_6_7
        description: PII stays right, whole, up to date and suited to its use, and
          there are ways to check and fix it.
        annotations:
          iso29100_clause:
            tag: iso29100_clause
            value: '6.7'
        title: 6.7 Correct and fit
      principle_6_8:
        text: principle_6_8
        description: People can easily find out what the organization does with PII,
          and hear about important changes.
        annotations:
          iso29100_clause:
            tag: iso29100_clause
            value: '6.8'
        title: 6.8 Say what happens
      principle_6_9:
        text: principle_6_9
        description: People can look at the PII held about them and dispute it, within
          what the law allows.
        annotations:
          iso29100_clause:
            tag: iso29100_clause
            value: '6.9'
        title: 6.9 People see their own
      principle_6_10:
        text: principle_6_10
        description: The organization writes down its duties, keeps protection in
          place when PII passes to others, and handles complaints and redress.
        annotations:
          iso29100_clause:
            tag: iso29100_clause
            value: '6.10'
        title: 6.10 Answer for it
      principle_6_11:
        text: principle_6_11
        description: Security measures at every level guard PII against loss and unauthorized
          reach for as long as it is held.
        annotations:
          iso29100_clause:
            tag: iso29100_clause
            value: '6.11'
        title: 6.11 Keep it safe
      principle_6_12:
        text: principle_6_12
        description: The organization checks, and can prove, that it meets its privacy
          duties, through audits and regular risk assessment.
        annotations:
          iso29100_clause:
            tag: iso29100_clause
            value: '6.12'
        title: 6.12 Show the rules are met
  PfOperation:
    name: PfOperation
    definition_uri: https://w3id.org/lmodel/iso29100/PfOperation
    description: The things an organization can do to PII.
    from_schema: https://w3id.org/lmodel/iso29100
    permissible_values:
      collect:
        text: collect
        description: Get PII from the person it is about, or from another source.
      store:
        text: store
        description: Hold PII on a lasting medium.
      retrieve:
        text: retrieve
        description: Fetch stored PII for use.
      consult:
        text: consult
        description: Look at PII without taking a copy away.
      alter:
        text: alter
        description: Change PII that is already held.
      pseudonymize:
        text: pseudonymize
        description: Swap identifying details for an alias, in a way someone can still
          trace back.
      anonymize:
        text: anonymize
        description: Change PII so that nobody can trace it back to a person again.
      disclose:
        text: disclose
        description: Make PII available to another party.
      disseminate:
        text: disseminate
        description: Spread PII widely, such as by publishing it.
      delete:
        text: delete
        description: Remove PII so that it can no longer be reached or used.
      destroy:
        text: destroy
        description: Remove PII and whatever carried it, beyond recovery.
  PfPiiRecognition:
    name: PfPiiRecognition
    definition_uri: https://w3id.org/lmodel/iso29100/PfPiiRecognition
    annotations:
      iso29100_clause:
        tag: iso29100_clause
        value: '5.4'
    description: The ways information turns out to be PII, which a record lists so
      that a reader can see why the item counts.
    from_schema: https://w3id.org/lmodel/iso29100
    permissible_values:
      direct_identifier:
        text: direct_identifier
        description: It singles out one person by itself, such as a passport number.
      distinguishing_trait:
        text: distinguishing_trait
        description: It sets one person apart, alone or with other details, such as
          a rare job title in a small town.
      linked_information:
        text: linked_information
        description: It says something about a person who is already known, or can
          be joined to a record that does.
      pseudonym:
        text: pseudonym
        description: It holds an alias in place of an identifier, and the alias can
          be traced.
      metadata:
        text: metadata
        description: It describes other data, such as a message's sender and time,
          and so reveals a person.
      unsolicited:
        text: unsolicited
        description: The organization received it without asking for it.
  PfSensitivity:
    name: PfSensitivity
    definition_uri: https://w3id.org/lmodel/iso29100/PfSensitivity
    annotations:
      iso29100_clause:
        tag: iso29100_clause
        value: '5.4'
    description: How much harm the PII could do to the person it is about.
    from_schema: https://w3id.org/lmodel/iso29100
    permissible_values:
      ordinary:
        text: ordinary
        description: It needs the usual protection for PII.
      sensitive:
        text: sensitive
        description: Its misuse could badly harm the person, or a law sets it apart,
          such as health data, so it needs stronger protection.
  PfRequirementFactor:
    name: PfRequirementFactor
    definition_uri: https://w3id.org/lmodel/iso29100/PfRequirementFactor
    annotations:
      iso29100_clause:
        tag: iso29100_clause
        value: '5.5'
    description: Where a requirement to safeguard PII comes from.
    from_schema: https://w3id.org/lmodel/iso29100
    permissible_values:
      law:
        text: law
        description: A statute, a regulation, a court's ruling or a collective agreement.
      contract:
        text: contract
        description: An agreement between parties, such as one with a processor, or
          rules that bind a group of companies.
      business:
        text: business
        description: How the business or its application works, or a code of practice
          it chose to follow.
      other:
        text: other
        description: Another source, such as what people have said they prefer, or
          a technical standard the organization adopted.
  PfPolicyAudience:
    name: PfPolicyAudience
    definition_uri: https://w3id.org/lmodel/iso29100/PfPolicyAudience
    annotations:
      iso29100_clause:
        tag: iso29100_clause
        value: '5.6'
    description: Who a privacy policy is written for.
    from_schema: https://w3id.org/lmodel/iso29100
    permissible_values:
      internal:
        text: internal
        description: People inside the organization, who act on its commitments.
      public_notice:
        text: public_notice
        description: The people whose PII it handles, who read it to learn what happens.
  PfControlKind:
    name: PfControlKind
    definition_uri: https://w3id.org/lmodel/iso29100/PfControlKind
    annotations:
      iso29100_clause:
        tag: iso29100_clause
        value: '5.7'
    description: The form a control takes.
    from_schema: https://w3id.org/lmodel/iso29100
    permissible_values:
      organizational:
        text: organizational
        description: A policy, a procedure, a role or another way of running things.
      physical:
        text: physical
        description: A measure that guards the places and equipment where PII sits.
      technical:
        text: technical
        description: A system, product or service that protects PII.
      privacy_enhancing_technology:
        text: privacy_enhancing_technology
        description: A technical measure built to reduce what is collected or revealed
          about people.
      contractual:
        text: contractual
        description: A binding agreement, such as one with a processor or across a
          group of companies.
  PfImplementationState:
    name: PfImplementationState
    definition_uri: https://w3id.org/lmodel/iso29100/PfImplementationState
    description: How far a control has been put into effect.
    from_schema: https://w3id.org/lmodel/iso29100
    permissible_values:
      planned:
        text: planned
        description: It is decided on but not started.
      in_progress:
        text: in_progress
        description: It is being put in place.
      in_operation:
        text: in_operation
        description: It is in place and working.
      retired:
        text: retired
        description: It is no longer in use.
  PfRiskLevel:
    name: PfRiskLevel
    definition_uri: https://w3id.org/lmodel/iso29100/PfRiskLevel
    description: A qualitative level of risk to people, offered for an organization
      that adopts it, since the framework leaves the scale to the organization.
    from_schema: https://w3id.org/lmodel/iso29100
    permissible_values:
      low:
        text: low
        description: The harm to people would be limited.
      medium:
        text: medium
        description: The harm would call for planned measures.
      high:
        text: high
        description: The harm could be serious.
      very_high:
        text: very_high
        description: The harm could be severe or lasting, and needs treating at once.
  PfConsentMechanism:
    name: PfConsentMechanism
    definition_uri: https://w3id.org/lmodel/iso29100/PfConsentMechanism
    description: How a person's agreement to processing is obtained.
    from_schema: https://w3id.org/lmodel/iso29100
    permissible_values:
      opt_in:
        text: opt_in
        description: The person acts to agree before the processing starts.
      opt_out:
        text: opt_out
        description: The processing goes ahead unless the person acts to refuse it.
      implied:
        text: implied
        description: Something the person does shows agreement, such as placing an
          order, where the law allows that reading.
  PfConsentState:
    name: PfConsentState
    definition_uri: https://w3id.org/lmodel/iso29100/PfConsentState
    description: Where a person's agreement stands.
    from_schema: https://w3id.org/lmodel/iso29100
    permissible_values:
      given:
        text: given
        description: The agreement holds.
      refused:
        text: refused
        description: The person said no.
      withdrawn:
        text: withdrawn
        description: The person took back an agreement they had given.
      expired:
        text: expired
        description: The agreement ran out.
slots:
  pf_id:
    name: pf_id
    definition_uri: https://w3id.org/lmodel/iso29100/pf_id
    description: The record's identifier, unique among the records of the framework,
      such as a URI or a CURIE. Other records refer to the record by it.
    from_schema: https://w3id.org/lmodel/iso29100
    slot_uri: iso29100:pf_id
    identifier: true
    owner: PfRecordMixin
    domain_of:
    - PfRecordMixin
    range: uriorcurie
    required: true
    pattern: ^\S+$
  title:
    name: title
