classes:
  PfRecordMixin:
    name: PfRecordMixin
    definition_uri: https://w3id.org/lmodel/iso29100/PfRecordMixin
    description: 'What every record of the framework has, so that other records can
      refer to it: an identifier, a title and a description.'
    comments:
    - It is a mixin, not a base class, so that the adapt copy can re-root some record
      classes on LOKF's Concept and leave the others as they are. lokf adapt replaces
      pf_id with LOKF's id, and a class that declares id itself must descend from
      Concept.
    from_schema: https://w3id.org/lmodel/iso29100
    mixin: true
    slots:
    - pf_id
    - PfRecordMixin_title
    - description
    slot_usage:
      title:
        name: title
        required: true
        pattern: ^\s*\S
    class_uri: iso29100:PfRecordMixin
  PfFramework:
    name: PfFramework
    definition_uri: https://w3id.org/lmodel/iso29100/PfFramework
    annotations:
      iso29100_clause:
        tag: iso29100_clause
        value: '5.1'
    description: 'One organization''s use of the privacy framework: the systems it
      covers, and every record the organization keeps about them, each kind in a list
      of its own.'
    from_schema: https://w3id.org/lmodel/iso29100
    mixins:
    - PfRecordMixin
    slots:
    - pf_jurisdictions
    - pfFramework__pf_organization
    - pfFramework__pf_ict_systems
    - pfFramework__pf_actors
    - pfFramework__pf_pii_items
    - pfFramework__pf_flows
    - pfFramework__pf_processing_activities
    - pfFramework__pf_safeguarding_requirements
    - pfFramework__pf_policies
    - pfFramework__pf_controls
    - pfFramework__pf_principle_implementations
    - pfFramework__pf_risks
    - pfFramework__pf_impact_assessments
    - pfFramework__pf_breaches
    - pfFramework__pf_consents
    - pfFramework__pf_preferences
    - pf_id
    - PfRecordMixin_title
    - description
    attributes:
      pf_organization:
        name: pf_organization
        description: The organization that applies the framework.
        required: true
      pf_ict_systems:
        name: pf_ict_systems
        description: The ICT systems the framework covers.
        multivalued: true
      pf_actors:
        name: pf_actors
        description: Those who take part in handling the PII.
        range: PfActor
