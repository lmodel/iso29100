    tree_root: true
  PfActor:
    name: PfActor
    definition_uri: https://w3id.org/lmodel/iso29100/PfActor
    annotations:
      iso29100_clause:
        tag: iso29100_clause
        value: '5.2'
    description: Someone who takes part in handling PII, told apart by the part they
      play. One party can play different parts for different PII, with a record for
      each.
    from_schema: https://w3id.org/lmodel/iso29100
    abstract: true
    mixins:
    - PfRecordMixin
    slots:
    - PfActor_pf_actor_type
    - pf_jurisdictions
    - pfActor__pf_contact
    - pf_id
    - PfRecordMixin_title
    - description
    slot_usage:
      pf_actor_type:
        name: pf_actor_type
        required: true
    attributes:
      pf_contact:
        name: pf_contact
        description: How to reach the actor about privacy.
    class_uri: iso29100:PfActor
  PfPiiPrincipal:
    name: PfPiiPrincipal
    definition_uri: https://w3id.org/lmodel/iso29100/PfPiiPrincipal
    annotations:
      iso29100_clause:
        tag: iso29100_clause
        value: '5.2'
    description: The person the PII is about, or a group of such people when the organization
      records them together.
    from_schema: https://w3id.org/lmodel/iso29100
    exact_mappings:
    - dpv:DataSubject
    is_a: PfActor
    slots:
    - PfActor_pf_actor_type
    - pf_jurisdictions
    - pfActor__pf_contact
    - pf_id
    - PfRecordMixin_title
    - description
    class_uri: iso29100:PfPiiPrincipal
  PfPiiController:
    name: PfPiiController
    definition_uri: https://w3id.org/lmodel/iso29100/PfPiiController
    annotations:
      iso29100_clause:
        tag: iso29100_clause
        value: '5.2'
    description: The party that decides why and how PII is processed, and answers
      for it even when another party does the work.
    from_schema: https://w3id.org/lmodel/iso29100
    exact_mappings:
    - dpv:DataController
    is_a: PfActor
    slots:
    - PfActor_pf_actor_type
    - pf_jurisdictions
    - pfActor__pf_contact
    - pf_id
    - PfRecordMixin_title
    - description
    - pf_purposes
    - pf_legal_bases
    - pfPiiController__pf_appointed_processors
    - pfPiiController__pf_controller_policy
    - pfPiiController__pf_privacy_officer
    attributes:
      pf_appointed_processors:
        name: pf_appointed_processors
        description: The processors that work for the controller.
        range: PfPiiProcessor
        multivalued: true
      pf_controller_policy:
        name: pf_controller_policy
        description: The privacy policy the controller works under.
        range: PfPolicy
      pf_privacy_officer:
        name: pf_privacy_officer
        description: The person who advises the controller on privacy, where there
          is one.
    class_uri: iso29100:PfPiiController
  PfPiiProcessor:
    name: PfPiiProcessor
    definition_uri: https://w3id.org/lmodel/iso29100/PfPiiProcessor
    annotations:
      iso29100_clause:
        tag: iso29100_clause
        value: '5.2'
    description: A party that processes PII for a controller, on that controller's
      instructions.
    from_schema: https://w3id.org/lmodel/iso29100
    exact_mappings:
    - dpv:DataProcessor
    is_a: PfActor
    slots:
    - PfActor_pf_actor_type
    - pf_jurisdictions
    - pfActor__pf_contact
    - pf_id
    - PfRecordMixin_title
    - description
    - pfPiiProcessor__pf_instructing_controllers
    - pfPiiProcessor__pf_processing_agreement
    - pfPiiProcessor__pf_sub_processors
    attributes:
      pf_instructing_controllers:
        name: pf_instructing_controllers
        description: The controllers whose instructions the processor follows.
        range: PfPiiController
        multivalued: true
      pf_processing_agreement:
        name: pf_processing_agreement
        description: The reference of the agreement that binds the processor, where
          there is one.
      pf_sub_processors:
        name: pf_sub_processors
        description: The processors this processor has engaged in turn.
        range: PfPiiProcessor
        multivalued: true
    class_uri: iso29100:PfPiiProcessor
  PfThirdParty:
    name: PfThirdParty
    definition_uri: https://w3id.org/lmodel/iso29100/PfThirdParty
    annotations:
      iso29100_clause:
        tag: iso29100_clause
        value: '5.2'
    description: A party outside the controller and its processors that receives PII
      for its own ends, and usually becomes a controller of that PII.
    from_schema: https://w3id.org/lmodel/iso29100
    is_a: PfActor
    slots:
    - PfActor_pf_actor_type
    - pf_jurisdictions
    - pfActor__pf_contact
    - pf_id
    - PfRecordMixin_title
    - description
    - pfThirdParty__pf_receiving_purpose
    - pfThirdParty__pf_transfer_basis
    attributes:
      pf_receiving_purpose:
        name: pf_receiving_purpose
        description: What the third party receives the PII for.
      pf_transfer_basis:
        name: pf_transfer_basis
        description: What makes the passing of PII to the third party lawful.
    class_uri: iso29100:PfThirdParty
  PfPiiItem:
    name: PfPiiItem
    definition_uri: https://w3id.org/lmodel/iso29100/PfPiiItem
    annotations:
      iso29100_clause:
        tag: iso29100_clause
        value: '5.4'
    description: A piece or set of information that can be tied to a person, why it
      counts as PII, how sensitive it is and how it is handled.
    comments:
    - DPV's mapping says dpv:PersonalData is narrower than the standard's PII, and
      this class keeps that direction.
    from_schema: https://w3id.org/lmodel/iso29100
    narrow_mappings:
    - dpv:PersonalData
    mixins:
    - PfRecordMixin
    slots:
    - pf_concerned_principals
    - pf_operations
    - pf_retention
    - pfPiiItem__pf_pii_categories
    - pfPiiItem__pf_recognized_by
    - pfPiiItem__pf_sensitivity
    - pfPiiItem__pf_pseudonymized
    - pfPiiItem__pf_linkability
    - pf_id
    - PfRecordMixin_title
    - description
    attributes:
      pf_pii_categories:
        name: pf_pii_categories
        description: What the item holds, in the organization's own words.
        multivalued: true
      pf_recognized_by:
        name: pf_recognized_by
        description: Why the information counts as PII.
        range: PfPiiRecognition
        multivalued: true
      pf_sensitivity:
        name: pf_sensitivity
        description: How sensitive the item is.
        range: PfSensitivity
      pf_pseudonymized:
        name: pf_pseudonymized
        description: Whether an alias stands in for the item's identifying details.
        range: boolean
      pf_linkability:
        name: pf_linkability
        description: How easily the item could be joined with other data to identify
          someone, in the organization's words.
    class_uri: iso29100:PfPiiItem
  PfPiiFlow:
    name: PfPiiFlow
    definition_uri: https://w3id.org/lmodel/iso29100/PfPiiFlow
    annotations:
      iso29100_clause:
        tag: iso29100_clause
        value: '5.3'
    description: One way PII passes from one actor to another, and who decides what
      happens to it afterwards.
    from_schema: https://w3id.org/lmodel/iso29100
    mixins:
    - PfRecordMixin
    slots:
    - pf_concerned_pii
    - pfPiiFlow__pf_provider
    - pfPiiFlow__pf_recipient
    - pfPiiFlow__pf_decides_afterwards
    - pf_id
    - PfRecordMixin_title
    - description
    attributes:
      pf_provider:
        name: pf_provider
        description: The actor the PII comes from.
        range: PfActor
        required: true
      pf_recipient:
        name: pf_recipient
        description: The actor the PII goes to.
        range: PfActor
        required: true
      pf_decides_afterwards:
        name: pf_decides_afterwards
        description: The actor that decides what happens to the PII once it has passed.
          A processor never holds this position.
        range: PfActor
    class_uri: iso29100:PfPiiFlow
  PfProcessingActivity:
    name: PfProcessingActivity
    definition_uri: https://w3id.org/lmodel/iso29100/PfProcessingActivity
    description: 'Something the organization does with PII: why, on what basis, what
      it does to which PII, who is responsible, and how long the PII is kept.'
    comments:
    - The fields are what an adopter keeps. The framework's own subject here is what
      counts as processing, which PfOperation lists.
    from_schema: https://w3id.org/lmodel/iso29100
    mixins:
    - PfRecordMixin
    slots:
    - pf_purposes
    - pf_legal_bases
    - pf_operations
    - pf_concerned_pii
    - pf_retention
    - pf_related_controls
    - pfProcessingActivity__pf_controller
    - pfProcessingActivity__pf_processors
    - pfProcessingActivity__pf_activity_flows
    - pfProcessingActivity__pf_sensitivities
    - pfProcessingActivity__pf_crosses_borders
    - pfProcessingActivity__pf_transfer_safeguards
    - pf_id
    - PfRecordMixin_title
    - description
    attributes:
      pf_controller:
        name: pf_controller
        description: The controller that answers for the activity.
        range: PfPiiController
        required: true
      pf_processors:
        name: pf_processors
        description: The processors that do the work.
        range: PfPiiProcessor
        multivalued: true
      pf_activity_flows:
        name: pf_activity_flows
        description: The flows of PII the activity involves.
        range: PfPiiFlow
        multivalued: true
      pf_sensitivities:
        name: pf_sensitivities
        description: The levels of sensitivity among the PII involved.
        range: PfSensitivity
        multivalued: true
      pf_crosses_borders:
        name: pf_crosses_borders
        description: Whether PII leaves the jurisdiction it was collected in.
        range: boolean
      pf_transfer_safeguards:
        name: pf_transfer_safeguards
        description: What protects the PII when it crosses a border.
        multivalued: true
    class_uri: iso29100:PfProcessingActivity
  PfSafeguardingRequirement:
    name: PfSafeguardingRequirement
    definition_uri: https://w3id.org/lmodel/iso29100/PfSafeguardingRequirement
    annotations:
      iso29100_clause:
        tag: iso29100_clause
        value: '5.5'
    description: Something the organization must do to protect PII, and where that
      duty comes from.
    from_schema: https://w3id.org/lmodel/iso29100
    mixins:
    - PfRecordMixin
    slots:
    - pfSafeguardingRequirement__pf_requirement_factor
    - pfSafeguardingRequirement__pf_requirement_source
    - pfSafeguardingRequirement__pf_applies_to
    - pfSafeguardingRequirement__pf_met_by
    - pf_id
    - PfRecordMixin_title
    - description
    attributes:
      pf_requirement_factor:
        name: pf_requirement_factor
        description: Where the requirement comes from.
        range: PfRequirementFactor
        required: true
      pf_requirement_source:
        name: pf_requirement_source
        description: The law, contract or other document that states it.
      pf_applies_to:
        name: pf_applies_to
        description: The actors that must meet it.
        range: PfActor
        multivalued: true
      pf_met_by:
        name: pf_met_by
        description: The controls that meet it.
        range: PfControl
        multivalued: true
    class_uri: iso29100:PfSafeguardingRequirement
  PfPolicy:
    name: PfPolicy
    definition_uri: https://w3id.org/lmodel/iso29100/PfPolicy
    annotations:
      iso29100_clause:
        tag: iso29100_clause
        value: '5.6'
    description: 'A privacy policy: what the organization commits to about PII, written
      for its own people or as a notice to the people whose PII it handles.'
    from_schema: https://w3id.org/lmodel/iso29100
    mixins:
    - PfRecordMixin
    slots:
    - pf_purposes
    - pf_concerned_pii
    - pf_principles
    - pfPolicy__pf_policy_audience
    - pfPolicy__pf_policy_version
    - pfPolicy__pf_policy_scope
    - pfPolicy__pf_policy_effective_date
    - pfPolicy__pf_policy_last_reviewed
    - pfPolicy__pf_retention_statement
    - pfPolicy__pf_stated_rights
    - pfPolicy__pf_inquiry_contact
    - pf_id
    - PfRecordMixin_title
    - description
    attributes:
      pf_policy_audience:
        name: pf_policy_audience
        description: Who the policy is written for.
        range: PfPolicyAudience
        required: true
      pf_policy_version:
        name: pf_policy_version
        description: The version of the policy.
      pf_policy_scope:
        name: pf_policy_scope
        description: What the policy covers.
      pf_policy_effective_date:
        name: pf_policy_effective_date
        description: When the policy takes effect.
        range: date
      pf_policy_last_reviewed:
        name: pf_policy_last_reviewed
        description: When the policy was last reviewed.
        range: date
      pf_retention_statement:
        name: pf_retention_statement
        description: What the policy says about how long PII is kept.
      pf_stated_rights:
        name: pf_stated_rights
        description: The rights the policy tells people they have.
        multivalued: true
      pf_inquiry_contact:
        name: pf_inquiry_contact
        description: Where people can send questions about the policy.
    class_uri: iso29100:PfPolicy
  PfControl:
    name: PfControl
    definition_uri: https://w3id.org/lmodel/iso29100/PfControl
    annotations:
      iso29100_clause:
        tag: iso29100_clause
        value: '5.7'
    description: A measure that treats a privacy risk by making it less likely or
      less harmful, the principles it serves and how far it has been put into effect.
    from_schema: https://w3id.org/lmodel/iso29100
    mixins:
    - PfRecordMixin
    slots:
    - pf_principles
    - pf_evidence
    - pfControl__pf_control_kind
    - pfControl__pf_control_objective
    - pfControl__pf_control_detail
    - pfControl__pf_control_responsible
    - pfControl__pf_control_state
    - pfControl__pf_answers_requirements
    - pf_id
    - PfRecordMixin_title
    - description
    attributes:
      pf_control_kind:
        name: pf_control_kind
        description: The form the control takes.
        range: PfControlKind
        required: true
      pf_control_objective:
        name: pf_control_objective
        description: What the control is meant to achieve.
      pf_control_detail:
        name: pf_control_detail
        description: How the control is put into effect.
      pf_control_responsible:
        name: pf_control_responsible
        description: The actor that answers for the control.
        range: PfActor
      pf_control_state:
        name: pf_control_state
        description: How far the control has been put into effect.
        range: PfImplementationState
      pf_answers_requirements:
        name: pf_answers_requirements
        description: The safeguarding requirements the control answers to.
        range: PfSafeguardingRequirement
        multivalued: true
    class_uri: iso29100:PfControl
  PfPrincipleImplementation:
    name: PfPrincipleImplementation
    definition_uri: https://w3id.org/lmodel/iso29100/PfPrincipleImplementation
    annotations:
      iso29100_clause:
        tag: iso29100_clause
        value: '6.1'
    description: 'How the organization stands against one privacy principle: what
      it does, what shows it, and what is still missing.'
    from_schema: https://w3id.org/lmodel/iso29100
    mixins:
    - PfRecordMixin
    slots:
    - pf_related_controls
    - pf_evidence
    - pfPrincipleImplementation__pf_principle
    - pfPrincipleImplementation__pf_measures
    - pfPrincipleImplementation__pf_gaps
    - pfPrincipleImplementation__pf_improvements
    - pfPrincipleImplementation__pf_last_assessed
    - pf_id
    - PfRecordMixin_title
    - description
    attributes:
      pf_principle:
        name: pf_principle
        description: The principle the record is about.
        range: PfPrinciple
        required: true
      pf_measures:
        name: pf_measures
        description: What the organization does to follow the principle.
        multivalued: true
      pf_gaps:
        name: pf_gaps
        description: Where the organization falls short.
        multivalued: true
      pf_improvements:
        name: pf_improvements
        description: What the organization will do about the gaps.
        multivalued: true
      pf_last_assessed:
        name: pf_last_assessed
        description: When the organization last checked its standing.
        range: date
    class_uri: iso29100:PfPrincipleImplementation
  PfRisk:
    name: PfRisk
    definition_uri: https://w3id.org/lmodel/iso29100/PfRisk
    description: 'A way that handling PII could harm people: where the risk comes
      from, how likely and how bad it is, and what is done about it.'
    comments:
    - The framework names privacy risk as an idea and leaves the scale to the organization.
      These fields are what an adopter keeps.
    from_schema: https://w3id.org/lmodel/iso29100
    mixins:
    - PfRecordMixin
    slots:
    - pf_concerned_pii
    - pf_concerned_principals
    - pf_related_controls
    - pfRisk__pf_risk_source
    - pfRisk__pf_risk_likelihood
    - pfRisk__pf_risk_consequence
    - pfRisk__pf_risk_inherent_level
    - pfRisk__pf_risk_residual_level
    - pfRisk__pf_risk_owner
    - pf_id
    - PfRecordMixin_title
    - description
    attributes:
      pf_risk_source:
        name: pf_risk_source
        description: Where the risk comes from.
      pf_risk_likelihood:
        name: pf_risk_likelihood
        description: How likely the harm is, in the organization's own terms.
      pf_risk_consequence:
        name: pf_risk_consequence
        description: What the harm to people would be.
      pf_risk_inherent_level:
        name: pf_risk_inherent_level
        description: The risk's level before controls.
        range: PfRiskLevel
      pf_risk_residual_level:
        name: pf_risk_residual_level
        description: The risk's level after controls, which is never above the level
          before.
        range: PfRiskLevel
      pf_risk_owner:
        name: pf_risk_owner
        description: The person who answers for the risk.
    class_uri: iso29100:PfRisk
  PfImpactAssessment:
    name: PfImpactAssessment
    definition_uri: https://w3id.org/lmodel/iso29100/PfImpactAssessment
    description: A review of what a system or activity could do to people's privacy,
      the risks it found and what became of them.
    comments:
    - These fields are what an adopter keeps, and go beyond the framework itself.
    from_schema: https://w3id.org/lmodel/iso29100
    mixins:
    - PfRecordMixin
    slots:
    - pfImpactAssessment__pf_assessment_scope
    - pfImpactAssessment__pf_assessment_date
    - pfImpactAssessment__pf_assessor
    - pfImpactAssessment__pf_assessed_activities
    - pfImpactAssessment__pf_risks_found
    - pfImpactAssessment__pf_risks_treated
    - pfImpactAssessment__pf_risks_accepted
    - pfImpactAssessment__pf_assessment_outcome
    - pfImpactAssessment__pf_consultations
    - pfImpactAssessment__pf_next_assessment
    - pf_id
    - PfRecordMixin_title
    - description
    attributes:
      pf_assessment_scope:
        name: pf_assessment_scope
        description: What the assessment looks at.
      pf_assessment_date:
        name: pf_assessment_date
        description: When the assessment was done.
        range: date
      pf_assessor:
        name: pf_assessor
        description: Who did the assessment.
      pf_assessed_activities:
        name: pf_assessed_activities
        description: The processing activities it looks at.
        range: PfProcessingActivity
        multivalued: true
      pf_risks_found:
        name: pf_risks_found
        description: The risks it found.
        range: PfRisk
        multivalued: true
      pf_risks_treated:
        name: pf_risks_treated
        description: Those of the risks found that have been treated.
        range: PfRisk
        multivalued: true
      pf_risks_accepted:
        name: pf_risks_accepted
        description: Those of the risks found that the organization has accepted as
          they stand.
        range: PfRisk
        multivalued: true
      pf_assessment_outcome:
        name: pf_assessment_outcome
        description: What the assessment concluded.
      pf_consultations:
        name: pf_consultations
        description: Who was asked, and what they said.
        multivalued: true
      pf_next_assessment:
        name: pf_next_assessment
        description: When the next assessment is due, which is after this one.
        range: date
    class_uri: iso29100:PfImpactAssessment
  PfBreach:
    name: PfBreach
    definition_uri: https://w3id.org/lmodel/iso29100/PfBreach
    description: 'A time when PII was handled against a safeguarding requirement:
      what happened, who was told and what was done.'
    comments:
    - The framework names the idea of a breach. These fields are what an adopter keeps,
      and go beyond the framework itself.
    from_schema: https://w3id.org/lmodel/iso29100
    mixins:
    - PfRecordMixin
    slots:
    - pf_concerned_pii
    - pfBreach__pf_breach_occurred
    - pfBreach__pf_breach_discovered
    - pfBreach__pf_breach_closed
    - pfBreach__pf_principals_affected
    - pfBreach__pf_breached_requirements
    - pfBreach__pf_breach_severity
    - pfBreach__pf_immediate_actions
    - pfBreach__pf_notification_required
    - pfBreach__pf_notifications
    - pfBreach__pf_remediation
    - pfBreach__pf_lessons
    - pf_id
    - PfRecordMixin_title
    - description
    attributes:
      pf_breach_occurred:
        name: pf_breach_occurred
        description: When the breach happened.
        range: datetime
      pf_breach_discovered:
        name: pf_breach_discovered
        description: When the organization found out, which is not before it happened.
        range: datetime
      pf_breach_closed:
        name: pf_breach_closed
        description: When the organization closed the matter, which is not before
          it found out.
        range: datetime
      pf_principals_affected:
        name: pf_principals_affected
        description: How many people the breach reached, where that is known.
        range: integer
        minimum_value: 1
