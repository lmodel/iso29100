    title: String!
    description: String
  }

interface PfRecordMixin
  {
    pfId: String!
    title: String!
    description: String
  }

type PfRisk implements PfRecordMixin
  {
    pfConcernedPii: [PfPiiItem]
    pfConcernedPrincipals: [PfPiiPrincipal]
