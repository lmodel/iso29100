    pfRiskSource: String
    pfRiskLikelihood: String
    pfRiskConsequence: String
    pfRiskInherentLevel: PfRiskLevel
    pfRiskResidualLevel: PfRiskLevel
    pfRiskOwner: String
    pfId: String!
    title: String!
    description: String
  }

type PfSafeguardingRequirement implements PfRecordMixin
  {
    pfRequirementFactor: PfRequirementFactor!
    pfRequirementSource: String
