# metamodel_version: 1.12.0
# version: 2024
enum PfConsentMechanism
  {
    opt_in
    opt_out
    implied
  }

enum PfConsentState
  {
    given
    refused
    withdrawn
    expired
  }

enum PfControlKind
  {
    organizational
    physical
    technical
    privacy_enhancing_technology
    contractual
  }

enum PfImplementationState
  {
    planned
    in_progress
    in_operation
    retired
  }

enum PfOperation
  {
    collect
    store
    retrieve
    consult
    alter
    pseudonymize
    anonymize
    disclose
    disseminate
    delete
    destroy
  }

enum PfPiiRecognition
  {
    direct_identifier
    distinguishing_trait
    linked_information
    pseudonym
    metadata
    unsolicited
  }

enum PfPolicyAudience
  {
    internal
    public_notice
  }

enum PfPrinciple
  {
    principle_6_2
    principle_6_3
    principle_6_4
    principle_6_5
    principle_6_6
    principle_6_7
    principle_6_8
    principle_6_9
    principle_6_10
    principle_6_11
    principle_6_12
  }

enum PfRequirementFactor
  {
    law
    contract
    business
    other
  }

enum PfRiskLevel
  {
    low
    medium
    high
    very_high
  }

enum PfSensitivity
  {
    ordinary
    sensitive
  }

type PfActor implements PfRecordMixin
  {
    pfActorType: String!
    pfJurisdictions: [String]
    pfContact: String
    pfId: String!
    title: String!
    description: String
  }

type PfBreach implements PfRecordMixin
  {
    pfConcernedPii: [PfPiiItem]
    pfBreachOccurred: String
    pfBreachDiscovered: String
    pfBreachClosed: String
    pfPrincipalsAffected: Int
    pfBreachedRequirements: [PfSafeguardingRequirement]
    pfBreachSeverity: PfRiskLevel
    pfImmediateActions: [String]
    pfNotificationRequired: Boolean
    pfNotifications: [String]
    pfRemediation: [String]
    pfLessons: String
    pfId: String!
    title: String!
    description: String
  }

type PfConsent implements PfRecordMixin
  {
    pfPurposes: [String]
    pfConcernedPii: [PfPiiItem]
    pfEvidence: [String]
    pfPrincipal: PfPiiPrincipal!
    pfConsentMechanism: PfConsentMechanism
    pfConsentGiven: String
    pfConsentState: PfConsentState!
    pfConsentWithdrawn: String
    pfId: String!
    title: String!
    description: String
  }

type PfControl implements PfRecordMixin
  {
    pfPrinciples: [PfPrinciple]
    pfEvidence: [String]
    pfControlKind: PfControlKind!
    pfControlObjective: String
    pfControlDetail: String
    pfControlResponsible: PfActor
    pfControlState: PfImplementationState
    pfAnswersRequirements: [PfSafeguardingRequirement]
    pfId: String!
    title: String!
    description: String
  }

type PfFramework implements PfRecordMixin
  {
    pfJurisdictions: [String]
    pfOrganization: String!
    pfIctSystems: [String]
    pfActors: [PfActor]
    pfPiiItems: [PfPiiItem]
    pfFlows: [PfPiiFlow]
    pfProcessingActivities: [PfProcessingActivity]
    pfSafeguardingRequirements: [PfSafeguardingRequirement]
    pfPolicies: [PfPolicy]
    pfControls: [PfControl]
    pfPrincipleImplementations: [PfPrincipleImplementation]
    pfRisks: [PfRisk]
    pfImpactAssessments: [PfImpactAssessment]
    pfBreaches: [PfBreach]
    pfConsents: [PfConsent]
    pfPreferences: [PfPreference]
    pfId: String!
    title: String!
    description: String
  }

type PfImpactAssessment implements PfRecordMixin
  {
    pfAssessmentScope: String
    pfAssessmentDate: String
    pfAssessor: String
    pfAssessedActivities: [PfProcessingActivity]
    pfRisksFound: [PfRisk]
    pfRisksTreated: [PfRisk]
    pfRisksAccepted: [PfRisk]
    pfAssessmentOutcome: String
    pfConsultations: [String]
    pfNextAssessment: String
    pfId: String!
    title: String!
    description: String
  }

type PfPiiController
  {
    pfActorType: String!
    pfJurisdictions: [String]
    pfContact: String
    pfId: String!
    title: String!
    description: String
    pfPurposes: [String]
    pfLegalBases: [String]
    pfAppointedProcessors: [PfPiiProcessor]
    pfControllerPolicy: PfPolicy
    pfPrivacyOfficer: String
  }

type PfPiiFlow implements PfRecordMixin
  {
    pfConcernedPii: [PfPiiItem]
    pfProvider: PfActor!
    pfRecipient: PfActor!
    pfDecidesAfterwards: PfActor
    pfId: String!
    title: String!
    description: String
  }

type PfPiiItem implements PfRecordMixin
  {
    pfConcernedPrincipals: [PfPiiPrincipal]
    pfOperations: [PfOperation]
    pfRetention: PfDuration
    pfPiiCategories: [String]
    pfRecognizedBy: [PfPiiRecognition]
    pfSensitivity: PfSensitivity
    pfPseudonymized: Boolean
    pfLinkability: String
    pfId: String!
    title: String!
    description: String
  }

type PfPiiPrincipal
  {
    pfActorType: String!
    pfJurisdictions: [String]
    pfContact: String
    pfId: String!
    title: String!
    description: String
  }

