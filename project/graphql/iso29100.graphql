  {
    pfActorType: String!
    pfJurisdictions: [String]
    pfContact: String
    pfId: String!
    title: String!
    description: String
    pfInstructingControllers: [PfPiiController]
    pfProcessingAgreement: String
    pfSubProcessors: [PfPiiProcessor]
  }

type PfPolicy implements PfRecordMixin
  {
    pfPurposes: [String]
    pfConcernedPii: [PfPiiItem]
    pfPrinciples: [PfPrinciple]
    pfPolicyAudience: PfPolicyAudience!
    pfPolicyVersion: String
    pfPolicyScope: String
    pfPolicyEffectiveDate: String
    pfPolicyLastReviewed: String
    pfRetentionStatement: String
    pfStatedRights: [String]
    pfInquiryContact: String
    pfId: String!
    title: String!
    description: String
  }

type PfPreference implements PfRecordMixin
  {
    pfPrincipal: PfPiiPrincipal!
    pfPreferenceScope: String
    pfWantsAnonymity: Boolean
    pfWantsPseudonymity: Boolean
    pfRefusedOperations: [PfOperation]
    pfRefusedRecipients: [String]
    pfPreferenceRecorded: String
    pfId: String!
    title: String!
    description: String
  }

type PfPrincipleImplementation implements PfRecordMixin
  {
    pfRelatedControls: [PfControl]
    pfEvidence: [String]
    pfPrinciple: PfPrinciple!
    pfMeasures: [String]
    pfGaps: [String]
    pfImprovements: [String]
    pfLastAssessed: String
    pfId: String!
    title: String!
    description: String
  }

type PfProcessingActivity implements PfRecordMixin
  {
    pfPurposes: [String]
    pfLegalBases: [String]
    pfOperations: [PfOperation]
    pfConcernedPii: [PfPiiItem]
    pfRetention: PfDuration
    pfRelatedControls: [PfControl]
    pfController: PfPiiController!
    pfProcessors: [PfPiiProcessor]
    pfActivityFlows: [PfPiiFlow]
    pfSensitivities: [PfSensitivity]
