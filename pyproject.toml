[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[project]
# Named like lmodel/slsa's slsa-linkml, so the PyPI name says what it holds;
# the import package stays iso29100. PyPI publishing is off.
name = "iso29100-linkml"
description = "ISO/IEC 29100:2024 privacy framework records (LinkML)"
authors = [
  {name = "Noel McLoughlin", email = "noel.mcloughlin@gmail.com"},
]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]

dependencies = [
  "linkml-runtime >=1.9.4",
]

[dependency-groups]
dev = [
    "jsonschema>=4",
    "linkml>=1.12.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/iso29100"]

# See https://hatch.pypa.io/latest/config/build/#file-selection for how to
# explicitly include files other than default into the build distributions.

[tool.hatch.version]
source = "uv-dynamic-versioning"

# Ref.: https://github.com/ninoseki/uv-dynamic-versioning/
[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
fallback-version = "0.0.0"

# Ref.: https://docs.pytest.org/en/stable/reference/reference.html#configuration-options
[tool.pytest.ini_options]
testpaths = ["tests"]

# https://docs.astral.sh/ruff/configuration/
[tool.ruff]
exclude = [
    "src/iso29100/_version.py",
]
# Set oldest supported Python version
target-version = "py310"

# Ref.: https://github.com/codespell-project/codespell
[tool.codespell]
skip = [
  "LICENSE",
  "NOTICE",
  "pyproject.toml",
  "uv.lock",
  "project/*",
  "src/iso29100/datamodel/iso29100_pydantic.py",
  "src/iso29100/datamodel/iso29100.py",
  # ISO's records and DPV's mapping, copied as published; the neighbours' adapt
  # copies, copied as released; and files copied in by the KTL sidecar sync or
  # written by npm, not by hand.
  "src/iso29100/schema/iso-open-data/*",
  "upstream/*",
  "tests/neighbours/*",
  ".lokf/scripts/*",
  "website/package-lock.json",
]

# Reminder: words have to be lowercased for the ignore-words-list.
ignore-words-list = "linke"
quiet-level = 3

# Ref.: https://github.com/crate-ci/typos (spell checker)
[tool.typos.default.extend-words]
linke = "linke"

[tool.typos.files]
extend-exclude = [
  "LICENSE",
  "uv.lock",
  "pyproject.toml",
  "project/*",
  "src/iso29100/datamodel/iso29100_pydantic.py",
  "src/iso29100/datamodel/iso29100.py",
  "src/iso29100/schema/iso-open-data/*",
  "upstream/*",
  "tests/neighbours/*",
  ".lokf/scripts/*",
  "website/package-lock.json",
]
